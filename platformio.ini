; AstroTrack — ESP32 적도의 컨트롤러
; 빌드: pio run | 업로드: pio run -t upload | 모니터: pio device monitor

[env:esp32dev]
platform = espressif32
framework = arduino
board = esp32dev
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DTRACK_TX_PIN=21
    -DTRACK_RX_PIN=22
    -DTRACK_BTN_PIN=0
    -DTRACK_LED_PIN=2

[env:zhiyunble]
; ZHIYUN Weebill-S/Crane BLE 드라이버 전용 환경 — NimBLE-Arduino는 여기서만 링크.
; 기본 esp32dev(DJI CAN) 경로와 격리: lib_deps·ASTRO_ZHIYUN_BLE가 기본 빌드에
; 영향을 주지 않는다. 보딩 검증까지 실기 필요(HARDWARE-PENDING).
platform = espressif32
framework = arduino
board = esp32dev
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.3
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DTRACK_TX_PIN=21
    -DTRACK_RX_PIN=22
    -DTRACK_BTN_PIN=0
    -DTRACK_LED_PIN=2
    -DASTRO_ZHIYUN_BLE

[env:esp32c3]
; ESP32-C3 경로 — TWAI(CAN) 내장, 단일코어 160MHz RISC-V. 부하가 극히 가벼워 정확도 무관.
; 주의: C3는 GPIO22가 없음 → CAN은 GPIO4/5로 배정.
; C3-SuperMini(가장 흔한 저가 보드): 내장 LED가 GPIO8이고 active-low라
;   TRACK_LED_ACTIVE_LOW=1 기본. 부팅 버튼은 GPIO9.
; C3-DevKitM-1: GPIO8 LED는 WS2812(주소지정형)라 digitalWrite로 점등 불가 —
;   외부 LED를 다른 GPIO에 달고 -DTRACK_LED_ACTIVE_LOW=0과 핀 재배정 필요.
platform = espressif32
framework = arduino
board = esp32-c3-devkitm-1
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DTRACK_TX_PIN=4
    -DTRACK_RX_PIN=5
    -DTRACK_BTN_PIN=9
    -DTRACK_LED_PIN=8
    -DTRACK_LED_ACTIVE_LOW=1

[env:native]
; 호스트 단위테스트 전용 환경 (프로토콜 레이어 검증)
platform = native
build_flags = -std=c++17
test_filter = protocol_native
