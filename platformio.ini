; AstroTrack — ESP32 적도의 컨트롤러
; 빌드: pio run | 업로드: pio run -t upload | 모니터: pio device monitor

[env:esp32dev]
platform = espressif32
framework = arduino
board = esp32dev
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DTRACK_TX_PIN=21
    -DTRACK_RX_PIN=22

[env:zhiyunble]
; ZHIYUN Weebill-S/Crane BLE 드라이버 전용 환경 — NimBLE-Arduino는 여기서만 링크.
; 기본 esp32dev(DJI CAN) 경로와 격리: lib_deps·ASTRO_ZHIYUN_BLE가 기본 빌드에
; 영향을 주지 않는다. 보딩 검증까지 실기 필요(HARDWARE-PENDING).
platform = espressif32
framework = arduino
board = esp32dev
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.3
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DTRACK_TX_PIN=21
    -DTRACK_RX_PIN=22
    -DASTRO_ZHIYUN_BLE

[env:native]
; 호스트 단위테스트 전용 환경 (프로토콜 레이어 검증)
platform = native
build_flags = -std=c++17
test_filter = protocol_native
